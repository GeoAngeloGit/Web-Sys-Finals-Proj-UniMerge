<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UniMerge | Professional Bulk Emailing</title>
    <link href="https://fonts.googleapis.com/css2?family=Maven+Pro:wght@400;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="styles1.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg sticky-top shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand text-white fw-bold fs-3 serif" href="/">UniMerge</a>
            <div id="nav-auth-section" class="ms-auto d-flex align-items-center">
                <div class="dropdown">
                    <a class="nav-link dropdown-toggle text-white" href="#" role="button" id="profileMenu" data-bs-toggle="dropdown">
                        <i class="bi bi-person-circle fs-4"></i>
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end shadow">
                        <li><a class="dropdown-item" href="./home.html">Home</a></li>
                        <li><a class="dropdown-item text-danger" href="/logout">Sign Out</a></li>
                    </ul>
                </div>
            </div>
        </div>
    </nav>
    
    <div class="container py-5">
    <div class="row g-4">
        <div class="col-lg-4">
            <div class="card border-0 shadow-sm rounded-4 h-100 overflow-hidden">
                <div class="card-header bg-white p-3 border-bottom-0">
                    <h5 class="serif fw-bold text-deep-twilight mb-0">Mailing Batches</h5>
                </div>
                <div id="batch-list" class="list-group list-group-flush overflow-auto" style="max-height: 70vh;">
                    </div>
            </div>
        </div>

        <div class="col-lg-8">
            <div class="card border-0 shadow-sm rounded-4 h-100">
                <div id="details-placeholder" class="card-body d-flex flex-column align-items-center justify-content-center text-muted py-5">
                    <i class="bi bi-bar-chart-steps display-1 opacity-25"></i>
                    <p class="mt-3">Select a record from the left to view metrics</p>
                </div>

                <div id="details-content" class="d-none">
                    <div class="card-header bg-white p-4 border-bottom-0">
                        <div class="d-flex justify-content-between align-items-center">
                            <h4 id="detail-subject" class="serif fw-bold text-deep-twilight mb-0"></h4>
                            <div class="badge bg-soft-turquoise text-dark rounded-pill px-3 py-2" id="detail-date"></div>
                        </div>
                    </div>
                    <div class="card-body p-4">
                        <div class="mb-4">
                            <div class="d-flex justify-content-between mb-1">
                                <span class="small fw-bold">Delivery Success Rate</span>
                                <span class="small fw-bold" id="detail-percent">0%</span>
                            </div>
                            <div class="progress rounded-pill" style="height: 10px;">
                                <div id="detail-progress-bar" class="progress-bar" role="progressbar"></div>
                            </div>
                        </div>

                        <div class="table-responsive">
                            <table class="table table-hover align-middle">
                                <thead class="table-light small text-uppercase">
                                    <tr>
                                        <th>Recipient</th>
                                        <th>Status</th>
                                        <th>Log Message</th>
                                    </tr>
                                </thead>
                                <tbody id="logs-body">
                                    </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
